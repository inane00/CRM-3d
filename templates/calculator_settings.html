{% extends "base.html" %}

{% block title %}Настройки калькулятора{% endblock %}

{% block content %}
<h1>Настройки калькулятора себестоимости</h1>

<form method="POST" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Стоимость электричества (руб/кВт*ч)</label>
        <input type="number" step="0.01" class="form-control" name="electricity_cost_per_kwh" value="{{ settings.electricity_cost_per_kwh }}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Время печати 1 грамма (часы)</label>
        <input type="number" step="0.001" class="form-control" name="printing_time_hours_per_gram" value="{{ settings.printing_time_hours_per_gram }}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Налог (%)</label>
        <input type="number" step="0.1" class="form-control" name="tax_percent" value="{{ settings.tax_percent }}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Расходники (%)</label>
        <input type="number" step="0.1" class="form-control" name="consumables_percent" value="{{ settings.consumables_percent }}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Амортизация (%)</label>
        <input type="number" step="0.1" class="form-control" name="depreciation_percent" value="{{ settings.depreciation_percent }}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Прибыль (%)</label>
        <input type="number" step="0.1" class="form-control" name="profit_percent" value="{{ settings.profit_percent }}" required>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('calculator') }}" class="btn btn-secondary">Перейти к калькулятору</a>
    </div>
</form>
{% endblock %}
