{% extends "base.html" %}

{% block title %}{% if client %}Редактировать{% else %}Новый{% endif %} клиент{% endblock %}

{% block content %}
<h1>{% if client %}Редактировать клиента{% else %}Добавить нового клиента{% endif %}</h1>

<form method="POST">
    <div class="mb-3">
        <label for="name" class="form-label">Имя *</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ client.name if client else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Телефон</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ client.phone if client else '' }}">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ client.email if client else '' }}">
    </div>
    <div class="mb-3">
        <label for="telegram" class="form-label">Telegram</label>
        <input type="text" class="form-control" id="telegram" name="telegram" value="{{ client.telegram if client else '' }}">
    </div>
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{{ url_for('client_list') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
